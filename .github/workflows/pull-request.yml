name: Pull Request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  workflow-lint:
    uses: ./.github/workflows/_workflow_lint.yml
  static-analysis:
    uses: ./.github/workflows/_static-analysis.yml
    needs: workflow-lint
  static-dependency-checks:
    uses: ./.github/workflows/_static-dependency-checks.yml
    needs: static-analysis
  test-units:
    uses: ./.github/workflows/_test-units.yml
    needs: static-analysis
    secrets: inherit
  test-integrations:
    uses: ./.github/workflows/_test-integrations.yml
    needs: test-units
    secrets: inherit
  smoke-test:
    uses: ./.github/workflows/_test-smoke.yml
    needs: test-units
    secrets: inherit
  test-cli:
    uses: ./.github/workflows/_test-cli.yml
    needs: test-units
    secrets: inherit
