name: Unit Tests without PDF support

on:
  workflow_call:

env:
  # The bernard-ledit release the tests install with PIE.
  BERNARD_LEDIT_VERSION: "0.1.0-alpha2"

jobs:
  no-pdf-linux:
    name: Unit Tests on Linux without PDF support
    timeout-minutes: 30
    strategy:
      matrix:
        php-version:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: |
          ./vendor/bin/phpunit -c tests/pdffeatures.xml

  with-pdf-linux:
    name: Unit Tests on Linux with PDF support
    timeout-minutes: 30
    strategy:
      matrix:
        php-version:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: pie

      - name: Install bernard-ledit extension
        run: bash tools/install-bernard-ledit.sh "$BERNARD_LEDIT_VERSION"

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: ./vendor/bin/phpunit -c tests/phpunit.xml
