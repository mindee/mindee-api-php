name: Unit Tests without PDF support

on:
  workflow_call:

jobs:
  no-pdf-linux:
    name: Unit Tests on Linux without PDF support
    timeout-minutes: 30
    strategy:
      matrix:
        php-version:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: |
          ./vendor/bin/phpunit -c tests/pdffeatures.xml

  with-pdf-linux:
    name: Unit Tests on Linux with PDF support
    timeout-minutes: 30
    strategy:
      matrix:
        php-version:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: php-config

      - name: Resolve PDFium release
        id: pdfium
        shell: bash
        run: |
          rel="$(tr -d '[:space:]' < bernard-ledit/core/pdfium-release)"
          echo "dir=${rel//\//_}" >> "$GITHUB_OUTPUT"

      - name: Cache PDFium binary
        uses: actions/cache@v5
        with:
          path: bernard-ledit/core/.pdfium_cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ steps.pdfium.outputs.dir }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bernard-ledit
          key: php${{ matrix.php-version }}

      - name: Install bernard-ledit extension
        run: bash tools/install-bernard-ledit.sh

      # Harmless if the build finds PDFium on its own; required if it doesn't.
      - name: Point the extension at PDFium
        run: echo "PDFIUM_PATH=$(php -r 'echo ini_get("extension_dir");')/libpdfium.so" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: ./vendor/bin/phpunit -c tests/phpunit.xml
