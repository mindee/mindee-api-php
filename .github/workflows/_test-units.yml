name: Unit Tests without PDF support

on:
  workflow_call:

jobs:
  no-pdf-linux:
    name: Unit Tests on Linux without PDF support
    timeout-minutes: 30
    strategy:
      matrix:
        php-version:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: |
          ./vendor/bin/phpunit -c tests/pdffeatures.xml


  with-pdf-linux:
    name: Unit Tests on Linux with PDF support
    timeout-minutes: 30
    strategy:
      matrix:
        php-version:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Built by _build-bernard-ledit.yml, which the calling workflow must run first.
      - name: Download bernard-ledit PHP extension
        uses: actions/download-artifact@v4
        with:
          name: bernard-ledit-php-${{ matrix.php-version }}
          path: ${{ github.workspace }}/.github/artifacts/bernard-ledit

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: >-
            extension=${{ github.workspace }}/.github/artifacts/bernard-ledit/bernard_ledit.so,
            bernard_ledit.pdfium_path=${{ github.workspace }}/.github/artifacts/bernard-ledit/libpdfium.so

      - name: Check bernard-ledit is loaded
        run: |
          php -r 'exit(extension_loaded("bernard_ledit") ? 0 : 1);'

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: |
          ./vendor/bin/phpunit -c tests/phpunit.xml


  no-pdf-macos:
    name: Unit Tests on MacOS without PDF support
    timeout-minutes: 30
    strategy:
      matrix:
        php-version:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
    runs-on: "macos-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        env:
          phpts: zts
        with:
          php-version: ${{ matrix.php-version }}
      - uses: ramsey/composer-install@v3
      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: |
          ./vendor/bin/phpunit -c tests/pdffeatures.xml

