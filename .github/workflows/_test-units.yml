  no-pdf-windows:
    name: Unit Tests on Windows without PDF support
    timeout-minutes: 30
    strategy:
      matrix:
        php-version:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up php ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        env:
          phpts: zts
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, fileinfo, json
      - uses: ramsey/composer-install@v3
      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: |
          ./vendor/bin/phpunit -c tests/pdffeatures.xml

  with-pdf-windows:
    name: Unit Tests on Windows with PDF support
    timeout-minutes: 30
    strategy:
      matrix:
        php-version:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up php ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-version }}'
          extensions: curl, fileinfo, json, imagick

      - name: Install Ghostscript
        shell: powershell
        run: |
          $gsVersion = "10.03.1"
          $gsVersionCompact = $gsVersion.Replace('.', '')
          $installerUrl = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs$gsVersionCompact/gs${gsVersionCompact}w64.exe"
          $installerPath = "$env:TEMP\gs_installer.exe"
          $installDir = "C:\gs"
          
          Write-Host "Downloading Ghostscript $gsVersion..."
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath

          Unblock-File -Path $installerPath
          
          Write-Host "Running silent installation..."
          cmd.exe /c "start /wait `"`" `"$installerPath`" /S /D=$installDir"
          
          Write-Host "Adding Ghostscript to GITHUB_PATH..."
          Add-Content -Path $env:GITHUB_PATH -Value "$installDir\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$installDir\lib"
      - uses: ramsey/composer-install@v3
      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: |
          ./vendor/bin/phpunit -c tests/phpunit.xml
