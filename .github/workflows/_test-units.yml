  no-pdf-windows:
    name: Unit Tests on Windows without PDF support
    timeout-minutes: 30
    strategy:
      matrix:
        php-version:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up php ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        env:
          phpts: zts
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, fileinfo, json
      - uses: ramsey/composer-install@v3
      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: |
          ./vendor/bin/phpunit -c tests/pdffeatures.xml

  with-pdf-windows:
    name: Unit Tests on Windows with PDF support
    timeout-minutes: 30
    strategy:
      matrix:
        php-version:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ghostscript
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: choco install ghostscript -y --no-progress

      - name: Locate Ghostscript
        shell: pwsh
        run: |
          $gs = Get-ChildItem "C:\Program Files\gs\*\bin\gswin64c.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gs) {
            Write-Error "Ghostscript not found after install."
            exit 1
          }
          "$($gs.Directory)" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "Found Ghostscript at $($gs.FullName)"
      - name: Debug PHP + extensions
        shell: pwsh
        run: |
          where.exe php
          php --version
          php -m
          php -r "var_dump(extension_loaded('imagick'));"
      - name: Debug Ghostscript detection
        shell: pwsh
        run: |
          php -r "var_dump(glob('C:\\Program Files\\gs\\gs*\\bin\\gswin64c.exe'));"
          php -r "var_dump(glob('C:/Program Files/gs/gs*/bin/gswin64c.exe'));"
          php -r "echo getenv('PATH'), PHP_EOL;"
          php --version
          Get-ChildItem 'C:\Program Files\gs' -Recurse -Filter gswin64c.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      - name: Set up php ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        env:
          phpts: zts
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, fileinfo, json, imagick
      - uses: ramsey/composer-install@v3
      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: |
          ./vendor/bin/phpunit -c tests/phpunit.xml
