  integration-tests-windows:
    name: Run Integration Tests on Windows
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      matrix:
        php-version:
          - 8.1
          - 8.5
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up php ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-version }}'
          extensions: curl, fileinfo, json, imagick

      - name: Install Ghostscript
        shell: powershell
        run: |
          $gsVersion = "10.07.1"
          
          $gsVersionCompact = $gsVersion.Replace('.', '')
          $installerUrl = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs$gsVersionCompact/gs${gsVersionCompact}w64.exe"
          $installerPath = "$env:TEMP\gs_installer.exe"
          
          Write-Host "Downloading Ghostscript $gsVersion..."
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          
          Write-Host "Running silent installation..."
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait -NoNewWindow
          $binPath = "C:\Program Files\gs\gs$gsVersion\bin"
          $libPath = "C:\Program Files\gs\gs$gsVersion\lib"
          
          Write-Host "Adding Ghostscript to GITHUB_PATH..."
          Add-Content -Path $env:GITHUB_PATH -Value $binPath
          Add-Content -Path $env:GITHUB_PATH -Value $libPath
      - uses: ramsey/composer-install@v2
      - name: Unit testing with phpunit
        run: |
          ./vendor/bin/phpunit -c tests/functional.xml