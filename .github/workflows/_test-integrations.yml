  integration-tests-windows:
    name: Run Integration Tests on Windows
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      matrix:
        php-version:
          - 8.1
          - 8.5
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ghostscript
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: choco install ghostscript -y --no-progress

      - name: Locate Ghostscript
        shell: pwsh
        run: |
          $gs = Get-ChildItem "C:\Program Files\gs\*\bin\gswin64c.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gs) {
            Write-Error "Ghostscript not found after install."
            exit 1
          }
          "$($gs.Directory)" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "Found Ghostscript at $($gs.FullName)"
      - name: Set up php ${{ matrix.php-version }}
        uses: shivammathur/setup-php@2.35.1
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, fileinfo, json, imagick
      - name: Assert PHP version and imagick
        shell: pwsh
        run: |
          $expected = "${{ matrix.php-version }}"
          $actual = (php -r "echo PHP_MAJOR_VERSION.'.'.PHP_MINOR_VERSION;")
          if ($actual -ne $expected) {
            Write-Error "Expected PHP $expected but got $actual at $(where.exe php)"
            exit 1
          }
          php -r "if (!extension_loaded('imagick')) { fwrite(STDERR, 'imagick not loaded'.PHP_EOL); exit(1); }"
          Write-Host "OK: PHP $actual with imagick"
      - uses: ramsey/composer-install@v2
      - name: Unit testing with phpunit
        run: |
          ./vendor/bin/phpunit -c tests/functional.xml