#
# Run integration tests.
#
name: Integration Test

on:
  workflow_call:
  workflow_dispatch:

env:
  MINDEE_ACCOUNT_SE_TESTS: ${{ secrets.MINDEE_ACCOUNT_SE_TESTS }}
  MINDEE_ENDPOINT_SE_TESTS: ${{ secrets.MINDEE_ENDPOINT_SE_TESTS }}
  MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
  WORKFLOW_ID: ${{ secrets.WORKFLOW_ID_SE_TESTS }}
  MINDEE_V2_API_KEY: ${{ secrets.MINDEE_V2_SE_TESTS_API_KEY }}
  MINDEE_V2_FAILURE_WEBHOOK_ID: ${{ secrets.MINDEE_V2_SE_TESTS_WEBHOOK_ID }}
  MINDEE_V2_SE_TESTS_FAILURE_WEBHOOK_ID: ${{ secrets.MINDEE_V2_SE_TESTS_FAILURE_WEBHOOK_ID }}
  MINDEE_V2_FINDOC_MODEL_ID: ${{ secrets.MINDEE_V2_SE_TESTS_FINDOC_MODEL_ID }}
  MINDEE_V2_SE_TESTS_BLANK_PDF_URL: ${{ secrets.MINDEE_V2_SE_TESTS_BLANK_PDF_URL }}
  MINDEE_V2_CLASSIFICATION_MODEL_ID: ${{ secrets.MINDEE_V2_SE_TESTS_CLASSIFICATION_MODEL_ID }}
  MINDEE_V2_CROP_MODEL_ID: ${{ secrets.MINDEE_V2_SE_TESTS_CROP_MODEL_ID }}
  MINDEE_V2_SE_TESTS_CROP_EXTRACTION_MODEL_ID: ${{ secrets.MINDEE_V2_SE_TESTS_CROP_EXTRACTION_MODEL_ID }}
  MINDEE_V2_OCR_MODEL_ID: ${{ secrets.MINDEE_V2_SE_TESTS_OCR_MODEL_ID }}
  MINDEE_V2_SPLIT_MODEL_ID: ${{ secrets.MINDEE_V2_SE_TESTS_SPLIT_MODEL_ID }}

jobs:
  integration-tests-ubuntu:
    name: Run Integration Tests on Ubuntu
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      matrix:
        php-version:
          - 8.1
          - 8.5

    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, fileinfo, json
          tools: pie

      - name: Install bernard-ledit extension
        run: bash tools/install-bernard-ledit.sh

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Integration testing with phpunit
        run: ./vendor/bin/phpunit -c tests/functional.xml

  integration-tests-macos:
    name: Run Integration Tests on MacOS
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      matrix:
        php-version:
          - 8.1
          - 8.5
    runs-on: "macos-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, fileinfo, json
          tools: pie

      - name: Install bernard-ledit extension
        run: bash tools/install-bernard-ledit.sh

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Integration testing with phpunit
        run: ./vendor/bin/phpunit -c tests/functional.xml


  integration-tests-windows:
    name: Run Integration Tests on Windows
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      matrix:
        php-version:
          - 8.1
          - 8.5

    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, fileinfo, json
          tools: pie

      - name: Install bernard-ledit extension (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pie install "mindee/bernard-ledit"
          if (-not (php -m | Select-String -Pattern '^bernard_ledit$' -Quiet)) {
            Write-Error "bernard_ledit did not load"
            exit 1
          }
          php -r 'echo "bernard_ledit ", phpversion("bernard_ledit"), PHP_EOL;'

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Integration testing with phpunit
        run: |
          ./vendor/bin/phpunit -c tests/functional.xml
